name: CD Smoke

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-smoke:
    name: Docker build and API health smoke
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t obsidian-calendar-agent:ci .

      - name: Start container
        run: |
          docker run -d --rm --name obsidian-calendar-agent-ci \
            -p 8000:8000 \
            -e AGENT_API_KEY=ci-test-key \
            -e ENABLE_SCHEDULER=false \
            obsidian-calendar-agent:ci

      - name: Wait for API
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs obsidian-calendar-agent-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker stop obsidian-calendar-agent-ci || true
